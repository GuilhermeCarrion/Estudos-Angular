@let quantidadeItens = pegarQuantidadePessoas();

@if (quantidadeItens) {
  <h1>Existem itens: {{ quantidadeItens }}</h1>

  @for (pessoa of pessoas; track pessoa.id) {
    <app-pessoa
      [pessoa]="pessoa"
      (removerPessoaEmit)="removerPessoa2($event)"
    />
  }
} @else {
  <p>Nenhuma pessoa cadastrada.</p>
}

<button (click)="removerPessoa()">Remover pessoas</button>
